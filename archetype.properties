# Parameters used to generate this project with aem-project-archetype

groupId=com.anchora
artifactId=aem-anchora
version=1.0.0-SNAPSHOT
package=com.anchora
appId=anchora
appTitle=Anchora
aemVersion=cloud
sdkVersion=latest
languageCountry=${languageCountry}
