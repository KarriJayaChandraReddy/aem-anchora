<!--/*
    Hero banner. Values come from com.anchora.core.models.HeroBanner.
    Markup follows the Qantas hero + in-page nav so the styles can match.
*/-->
<sly data-sly-use.hero="com.anchora.core.models.HeroBanner">
    <div class="cq-placeholder" data-sly-test="${hero.empty && wcmmode.edit}" data-emptytext="Hero Banner"></div>
    <section class="cmp-hero hero-container" data-sly-test="${!hero.empty}">
        <div class="hero-wrapper">
            <div class="hero v2${hero.hasImage ? ' hide-image-mobile' : ' no-hero-image'}">
                <h1 class="cmp-hero__title" data-sly-test="${hero.title}">${hero.title}</h1>
                <div class="hero-image-and-content">
                    <div class="image cmp-hero__media" data-sly-test="${hero.hasImage}">
                        <sly data-sly-resource="${'image' @ resourceType='anchora/components/image'}"></sly>
                    </div>
                    <div class="hero-content-container has-text" data-sly-test="${hero.introduction}">
                        <div class="hero-text-content" data-testid="hero-text-content">
                            <div class="intro" data-testid="hero-intro">
                                ${hero.introduction @ context='html'}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="in-page-nav-wrapper" data-sly-test="${hero.jumpLinks}">
            <nav class="in-page-nav cmp-hero__links" aria-labelledby="${hero.linksHeadingId}">
                <h2 class="nav-heading title-01 cmp-hero__links-heading" id="${hero.linksHeadingId}">${hero.linksHeading}</h2>
                <div class="nav-links-wrapper">
                <ul class="nav-list">
                    <li data-sly-repeat.link="${hero.jumpLinks}">
                        <a class="nav-link body-01" href="${link.href}">${link.label}</a>
                    </li>
                </ul>
                </div>
            </nav>
        </div>
    </section>
</sly>
