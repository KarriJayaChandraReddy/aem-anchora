<!--/*
    Hero banner. Values come from com.anchora.core.models.HeroBanner.
*/-->
<sly data-sly-use.hero="com.anchora.core.models.HeroBanner">
    <section class="cmp-hero" data-sly-test="${!hero.empty || wcmmode.edit}">
        <h1 class="cmp-hero__title" data-sly-test="${hero.title}">${hero.title}</h1>
        <div class="cmp-hero__media" data-sly-test="${hero.hasImage || wcmmode.edit}">
            <sly data-sly-resource="${'image' @ resourceType='anchora/components/image'}"></sly>
        </div>
        <div class="cmp-hero__body">
            <div class="cmp-hero__lead">
                <div class="cmp-hero__introduction" data-sly-test="${hero.introduction}">${hero.introduction @ context='html'}</div>
            </div>
            <nav class="cmp-hero__links" aria-labelledby="${hero.linksHeadingId}" data-sly-test="${hero.jumpLinks}">
                <p class="cmp-hero__links-heading" id="${hero.linksHeadingId}">${hero.linksHeading}</p>
                <ul>
                    <li data-sly-repeat.link="${hero.jumpLinks}">
                        <a href="${link.href}">${link.label}</a>
                    </li>
                </ul>
            </nav>
        </div>
    </section>
</sly>
