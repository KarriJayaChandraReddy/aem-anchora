<sly data-sly-use.model="com.anchora.core.models.InfantBookingModel"></sly>
<sly data-sly-use.templates="core/wcm/components/commons/v1/templates.html"></sly>
<sly data-sly-call="${templates.placeholder @ isEmpty=model.empty, emptyTextAppend='Configure Infant Booking'}"></sly>

<section class="infantbooking"
         data-sly-test="${!model.empty}"
         data-cmp-is="infantbooking"
         data-link-icon="${model.linkIcon @ context='attribute'}">
    <div class="infantbooking__layout">
        <div class="infantbooking__intro">
            <h2 class="infantbooking__heading" data-sly-test="${model.sectionHeading}">${model.sectionHeading}</h2>
            <div class="infantbooking__description" data-sly-test="${model.description}">${model.description @ context='html'}</div>
        </div>
        <div class="infantbooking__accordion">
            <button type="button"
                    class="infantbooking__toggle"
                    data-sly-test="${model.expandAllLabel || model.collapseAllLabel}"
                    data-cmp-hook-infantbooking="toggle"
                    data-label-expand="${model.expandAllLabel @ context='attribute'}"
                    data-label-collapse="${model.collapseAllLabel @ context='attribute'}"
                    aria-expanded="false">${model.expandAllLabel}</button>
            <div class="infantbooking__list">
                <div class="infantbooking__item"
                     data-sly-repeat.item="${model.items}"
                     data-cmp-hook-infantbooking="item"
                     id="item${itemList.index}">
                    <h3 class="infantbooking__header">
                        <button id="item${itemList.index}-button"
                                class="infantbooking__button"
                                type="button"
                                aria-expanded="false"
                                aria-controls="item${itemList.index}-panel"
                                data-cmp-hook-infantbooking="button">
                            <span class="infantbooking__title">${item.title}</span>
                            <span class="infantbooking__icon" aria-hidden="true"></span>
                        </button>
                    </h3>
                    <div id="item${itemList.index}-panel"
                         class="infantbooking__panel infantbooking__panel--hidden"
                         role="region"
                         aria-labelledby="item${itemList.index}-button"
                         aria-hidden="true"
                         data-cmp-hook-infantbooking="panel">
                        <div class="infantbooking__answer" data-sly-test="${item.description}">${item.description @ context='html'}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<sly data-sly-use.clientlib="core/wcm/components/commons/v1/templates/clientlib.html"></sly>
<sly data-sly-call="${clientlib.all @ categories='anchora.components.infantbooking'}"></sly>
